[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibvap-edge-agent"
version = "0.1.0"
description = "IBVAP edge surveillance agent: RTSP ingestion, YOLO detection, ByteTrack, virtual zones, events, evidence, alerts"
requires-python = ">=3.12"
dependencies = [
    # Web / API
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.3",
    # Config / validation
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    # Logging
    "structlog==24.4.0",
    # Numerics / CV
    "numpy>=1.26.4",
    "opencv-python-headless==4.10.0.84",
    # AI — install PyTorch separately (see docs/setup.md for correct CUDA build)
    "ultralytics>=8.2.82",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.6.1",
    "mypy==1.11.1",
    "types-PyYAML==6.0.12.20240808",
]

[tool.setuptools.packages.find]
where = ["src"]

# pytest configuration lives in pytest.ini — do NOT add [tool.pytest.ini_options] here
# to avoid duplicate/conflicting config.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
